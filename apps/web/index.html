<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b8f72" />
    <title>AutoFlow</title>
  </head>
  <body>
    <main id="auth" class="auth-shell">
      <form id="login-form" class="auth-card">
        <div class="brand-mark">A</div>
        <h1>AutoFlow</h1>
        <p>Entre para administrar sua operacao de WhatsApp.</p>
        <label>E-mail<input name="email" type="email" autocomplete="email" required /></label>
        <label>Senha<input name="password" type="password" autocomplete="current-password" required /></label>
        <label>Empresa <small>(se sua conta tiver mais de uma)</small><input name="tenantSlug" /></label>
        <button type="submit">Entrar</button>
        <div class="auth-links"><button type="button" class="link" data-auth-view="register">Criar empresa</button><button type="button" class="link" data-auth-view="invite">Aceitar convite</button></div>
        <output id="login-message"></output>
      </form>
      <form id="register-form" class="auth-card hidden">
        <div class="brand-mark">A</div><h1>Criar sua empresa</h1><p>Comece com o periodo de avaliacao do plano Essencial.</p>
        <label>Empresa<input name="companyName" required /></label><label>Seu nome<input name="ownerName" required /></label>
        <label>E-mail<input name="email" type="email" required /></label><label>Senha<input name="password" type="password" minlength="10" required /></label>
        <input type="hidden" name="timezone" value="America/Sao_Paulo"><input type="hidden" name="acceptedTermsVersion" value="2026-07-16">
        <button type="submit">Criar empresa</button><div class="auth-links"><button type="button" class="link" data-auth-view="login">Voltar para entrar</button></div><output></output>
      </form>
      <form id="invite-form-auth" class="auth-card hidden">
        <div class="brand-mark">A</div><h1>Aceitar convite</h1><p>Use o codigo enviado pelo administrador da empresa.</p>
        <label>Codigo do convite<input name="token" required /></label><label>Seu nome<input name="name" required /></label>
        <label>Senha da conta<input name="password" type="password" minlength="10" required /></label>
        <input type="hidden" name="acceptedTermsVersion" value="2026-07-16">
        <button type="submit">Entrar na equipe</button><div class="auth-links"><button type="button" class="link" data-auth-view="login">Voltar para entrar</button></div><output></output>
      </form>
    </main>

    <div id="shell" class="shell hidden">
      <aside>
        <div class="brand"><span class="brand-mark">A</span><strong>AutoFlow</strong></div>
        <nav id="nav">
          <button data-page="dashboard" class="active">Visao geral</button>
          <button data-page="instances">Instancias</button>
          <button data-page="contacts">Contatos</button>
          <button data-page="lists">Listas</button>
          <button data-page="campaigns">Campanhas</button>
          <button data-page="team">Equipe</button>
          <button data-page="integrations">Integracoes</button>
          <button data-page="billing">Plano e cobranca</button>
        </nav>
        <button id="logout" class="ghost">Sair</button>
      </aside>
      <section class="workspace">
        <header><button id="menu" class="menu">☰</button><div><strong id="page-title">Visao geral</strong><small id="identity"></small></div><span id="health" class="status">Conectando</span></header>
        <div id="content" class="content"></div>
      </section>
    </div>
    <div id="toast" role="status"></div>
    <script type="module" src="/src/app.js"></script>
  </body>
</html>
