name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: autoflow_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d autoflow_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      NODE_ENV: test
      API_PORT: 3001
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/autoflow_test
      DATABASE_SCHEMA: saas
      REDIS_URL: redis://localhost:6379
      ACCESS_TOKEN_SECRET: ci-access-token-secret-with-at-least-32-chars
      REFRESH_TOKEN_SECRET: ci-refresh-token-secret-with-at-least-32-chars
      ENCRYPTION_KEY: Y2ktZW5jcnlwdGlvbi1rZXktMzItYnl0ZXMtbG9uZw==
      PUBLIC_APP_URL: http://localhost:3000
      CORS_ORIGINS: http://localhost:3000
      WHATSAPP_SESSION_PATH: .data/ci-sessions
      WHATSAPP_HEADLESS: "true"
      LOG_LEVEL: silent
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm build
      - run: pnpm check
      - run: pnpm test
